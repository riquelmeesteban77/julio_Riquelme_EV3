<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stylesejercicio1.css') }}">
</head>
<body>
    <div class="card">
        <h2>Cálculo de Notas</h2>
        <form action="/ejercicio1" method="POST">
            <div class="form-group">
                <label for="nota1">Nota 1 (10 a 70):</label>
                <input type="number" id="nota1" name="nota1" min="10" max="70" step="0.1" required>
            </div>
            <div class="form-group">
                <label for="nota2">Nota 2 (10 a 70):</label>
                <input type="number" id="nota2" name="nota2" min="10" max="70" step="0.1" required>
            </div>
            <div class="form-group">
                <label for="nota3">Nota 3 (10 a 70):</label>
                <input type="number" id="nota3" name="nota3" min="10" max="70" step="0.1" required>
            </div>
            <div class="form-group">
                <label for="asistencia">Asistencia (%):</label>
                <input type="number" id="asistencia" name="asistencia" min="0" max="100" step="0.1" required>
            </div>
            <button type="submit">Calcular</button>
        </form>

        {% if resultado %}
            {% if resultado.error %}
                <p style="color: #f87171; text-align: center;">{{ resultado.error }}</p>
            {% else %}
                <div class="resultado {{ resultado.estado }}">
                    El promedio de notas es: {{ resultado.promedio }}<br>
                    {{ resultado.estado }}
                </div>
            {% endif %}
        {% endif %}

        <a href="/" class="back-link">← Volver al inicio</a>
    </div>
</body>
</html>
